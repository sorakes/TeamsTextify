[supervisord]
nodaemon=true
user=root

[program:redis]
command=redis-server /app/redis.conf
user=redis
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nextjs]
command=npm run start
directory=/app
user=node
environment=HOME="/home/node",USER="node"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:node_worker]
command=npx tsx /app/src/workers/syncWorker.ts
directory=/app
user=node
environment=HOME="/home/node",USER="node",HF_HOME="/app/.cache",PYANNOTE_CACHE="/app/.cache"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
